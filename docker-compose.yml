services:
  db:
    image: postgres:17
    container_name: b201-postgres
    restart: unless-stopped
    env_file:
      - ${B201_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_HOST_PORT:-5319}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-b201} -d ${DB_NAME:-b201}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: b201-backend:latest
    pull_policy: build
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: b201-backend
    profiles: ["prod"]
    restart: unless-stopped
    env_file:
      - ${B201_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:?CORS_ALLOW_ALL_ORIGINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME:?ACCESS_TOKEN_LIFETIME is required}
      REFRESH_TOKEN_LIFETIME: ${REFRESH_TOKEN_LIFETIME:?REFRESH_TOKEN_LIFETIME is required}
      TIME_ZONE: ${TIME_ZONE:?TIME_ZONE is required}
      LANGUAGE_CODE: ${LANGUAGE_CODE:?LANGUAGE_CODE is required}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY is required}
      KAKAO_REDIRECT_URIS: ${KAKAO_REDIRECT_URIS:?KAKAO_REDIRECT_URIS is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      ROOT_ADMIN_ID: ${ROOT_ADMIN_ID:?ROOT_ADMIN_ID is required}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:?ROOT_ADMIN_PASSWORD is required}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
