name: Deploy FE

on:
  push:
    branches:
      - dev
    paths:
      - "FE/**"
      - ".github/workflows/fe_cd.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./FE

      - name: Build the project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
          VITE_KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}
        working-directory: ./FE

      - name: Clean dist directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -rf /home/ms/b201/FE/dist
            mkdir -p /home/ms/b201/FE/dist

      - name: Copy dist to server via SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > key
          chmod 600 key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

          scp -i key -o StrictHostKeyChecking=yes -r FE/dist/* \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ms/b201/FE/dist