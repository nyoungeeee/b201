name: BE CI

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/be-ci.yml"
  push:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/be-ci.yml"

jobs:
  be-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: BE/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Black check
        run: black . --check

      - name: Django check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --parallel 4