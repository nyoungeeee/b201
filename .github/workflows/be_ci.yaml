name: BE CI

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/be_ci.yaml"
  push:
    branches: ["main", "dev"]
    paths:
      - "BE/**"
      - ".github/workflows/be_ci.yaml"

jobs:
  be-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: b201_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d b201_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_NAME: b201_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: BE/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Black check
        run: black . --check

      - name: Django check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --parallel 4
