name: FE Admin CI

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "FE_ADMIN/**"
      - ".github/workflows/fe_admin_ci.yaml"
  push:
    branches: ["main", "dev"]
    paths:
      - "FE_ADMIN/**"
      - ".github/workflows/fe_admin_ci.yaml"

jobs:
  fe-admin-ci:
    name: Admin React CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FE_ADMIN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: FE_ADMIN/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
