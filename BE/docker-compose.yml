services:
  db:
    image: postgres:17
    container_name: project-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-b201}
      POSTGRES_USER: ${DB_USER:-b201}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-b201_password}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-b201} -d ${DB_NAME:-b201}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b201-backend
    restart: unless-stopped
    command: >
      sh -c "PGPASSWORD=\"${DB_PASSWORD:-b201_password}\" psql -h \"db\" -U \"${DB_USER:-b201}\" -d \"${DB_NAME:-b201}\" -v ON_ERROR_STOP=1 -c \"DROP SCHEMA public CASCADE; CREATE SCHEMA public;\" &&
             python manage.py migrate &&
             python manage.py seed_test_dummy_data &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-secret-key-for-dev-only}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DB_NAME: ${DB_NAME:-b201}
      DB_USER: ${DB_USER:-b201}
      DB_PASSWORD: ${DB_PASSWORD:-b201_password}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-test-key}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost/test-callback}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-test-secret}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  seed_dummy_data:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["seed"]
    command: >
      sh -c "PGPASSWORD=\"${DB_PASSWORD:-b201_password}\" psql -h \"db\" -U \"${DB_USER:-b201}\" -d \"${DB_NAME:-b201}\" -v ON_ERROR_STOP=1 -c \"DROP SCHEMA public CASCADE; CREATE SCHEMA public;\" &&
             python manage.py migrate &&
             python manage.py seed_test_dummy_data"
    environment:
      SECRET_KEY: ${SECRET_KEY:-secret-key-for-dev-only}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DB_NAME: ${DB_NAME:-b201}
      DB_USER: ${DB_USER:-b201}
      DB_PASSWORD: ${DB_PASSWORD:-b201_password}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-test-key}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost/test-callback}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-test-secret}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - db

volumes:
  postgres_data:
